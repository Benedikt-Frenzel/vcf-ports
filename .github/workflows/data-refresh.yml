name: Weekly data refresh
on:
  schedule:
    # Mondays at 06:00 UTC — outside the typical work day for most regions.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Refresh the VCF 9.1 ports snapshot
        run: mise run refresh-data

      - name: Refresh the Broadcom KB 327186 reference
        # Secondary source — don't block the ports snapshot if the KB page is unreachable.
        continue-on-error: true
        run: mise run refresh-kb-urls

      - name: Rebuild and verify the snapshot
        run: mise run build

      # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows.
      # A GitHub App token (preferred) or a fine-grained PR_TOKEN does.
      - name: Create GitHub App token
        id: app-token
        if: ${{ vars.REFRESH_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

      - name: Open a pull request with the refreshed data
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # Fixed branch: one refresh PR that is updated every week instead of
          # a new PR per run (PRs #21-#23 piled up with the timestamp suffix).
          branch: data/weekly-refresh
          commit-message: 'data: weekly snapshot refresh'
          title: 'Weekly VCF 9.1 snapshot refresh'
          body: |
            Automated weekly refresh of the bundled VCF 9.1 snapshot and
            the Broadcom KB 327186 reference.

            - Ports snapshot re-pulled from the public Broadcom Ports API and
              normalised by `scripts/data_normalize.py`.
            - KB 327186 public URL reference re-pulled when reachable.

            The refresh job already ran `mise run build` (all tests) before
            opening this PR. PR checks run only when the PR was opened with
            the GitHub App token or PR_TOKEN. Data-quality warnings are in
            the job summary of the refresh run.
          add-paths: |
            data/vcf-9.1.json
            data/kb327186-urls.json
          delete-branch: true
          token: ${{ steps.app-token.outputs.token || secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Report a failed scheduled refresh as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Weekly data refresh failed'
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue comment "$number" --body "Failed again: $RUN_URL"
          else gh issue create --title "$title" --body "Scheduled refresh failed: $RUN_URL"; fi
